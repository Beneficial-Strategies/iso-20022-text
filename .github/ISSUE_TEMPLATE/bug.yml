name: Bug in the build or the tools
description: The build, the coverage, the host layout or a tool of the hub fails or produces wrong output
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The command and its output, or the address that misbehaves.
    validations:
      required: true
  - type: input
    id: spoke
    attributes:
      label: Language repository involved, if any
      placeholder: iso-20022-text-pt
